# GitOps (sección 6.15): Argo CD sincroniza los manifiestos versionados con el clúster.
# Aplicar UNA vez:  kubectl apply -n argocd -f argocd/application.yaml
# A partir de ahí, Argo CD gestiona el despliegue (no kubectl apply manual).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realty-mlops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JuanNavas38/MLOPS-proyectoFinal.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      # Excluir lo que NO son manifiestos K8s aplicables:
      #  - mlflow/Dockerfile (build, no manifiesto)
      #  - dashboards de Grafana (JSON, se cargan vía ConfigMap/UI)
      #  - airflow/ (helm-values: lo gestiona la Application Helm aparte)
      exclude: "{mlflow/Dockerfile,observability/grafana/*-dashboard.json,airflow/*}"
  destination:
    server: https://kubernetes.default.svc
    namespace: default   # solo afecta recursos sin namespace; cada manifiesto trae el suyo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
