# Values del Helm chart oficial de Airflow (apache-airflow/airflow) — Nivel 4.
# Airflow 3.x con LocalExecutor, imagen propia (DAGs+pipeline horneados),
# Postgres EXTERNO (el de la base mlops/airflow_metadata) y MinIO/MLflow del clúster.
#
#   helm repo add apache-airflow https://airflow.apache.org
#   helm install airflow apache-airflow/airflow -n mlops -f k8s/airflow/helm-values.yaml

airflowVersion: "3.0.6"
executor: LocalExecutor

images:
  airflow:
    repository: juannavas38/realty-airflow
    tag: latest
    pullPolicy: IfNotPresent

# Clave Fernet estable (en producción iría como Secret externo)
fernetKey: "1qsiBDIw9fQ02ctMbVuIkKAY5E2wRgjjefEYp4pRfIs="

# Usar nuestro Postgres, no el del chart
postgresql:
  enabled: false
data:
  metadataConnection:
    user: mlops
    pass: mlops2026
    host: postgres-svc.postgres
    port: 5432
    db: airflow_metadata
    sslmode: disable

# DAGs vienen horneados en la imagen (no gitSync, no PVC)
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Variables del pipeline para TODOS los componentes de Airflow
env:
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow-svc.mlflow:5000"
  - name: DATABASE_URL
    value: "postgresql://mlops:mlops2026@postgres-svc.postgres:5432/mlops"
  - name: DATA_API_URL
    value: "http://data-api-svc.data-api:80"
  - name: DATA_GROUP_NUMBER
    value: "1"
  - name: MLFLOW_S3_ENDPOINT_URL
    value: "http://minio-svc.minio:9000"
  - name: AWS_ACCESS_KEY_ID
    value: "minioadmin"
  - name: AWS_SECRET_ACCESS_KEY
    value: "minioadmin2026"
  - name: PIPELINE_SRC
    value: "/opt/airflow/src"
  # 1 worker en el api-server: arranque único y estable (con varios, los primeros mueren
  # y el readiness probe mata el pod antes de estabilizar).
  - name: AIRFLOW__API__WORKERS
    value: "1"
  # El DAG importa sklearn/mlflow (pesado): subir el timeout de parseo para evitar
  # "DagBag import timeout" al ejecutar tareas. (Mejora futura: imports perezosos.)
  - name: AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT
    value: "120"
  - name: AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT
    value: "120"

# Recursos (minikube 8GB). El scheduler ejecuta las tareas (LocalExecutor),
# incluido preprocess de lotes grandes -> necesita memoria holgada.
scheduler:
  replicas: 1
  resources:
    requests: {cpu: "200m", memory: "768Mi"}
    limits:   {cpu: "1500m", memory: "3Gi"}

dagProcessor:
  enabled: true
  resources:
    requests: {cpu: "100m", memory: "384Mi"}
    limits:   {cpu: "500m", memory: "1Gi"}

apiServer:
  resources:
    requests: {cpu: "100m", memory: "512Mi"}
    limits:   {cpu: "500m", memory: "1Gi"}

triggerer:
  replicas: 1
  resources:
    requests: {cpu: "100m", memory: "384Mi"}
    limits:   {cpu: "500m", memory: "768Mi"}

statsd:
  enabled: false

# Exponer la UI por NodePort
webserver:
  service:
    type: NodePort
