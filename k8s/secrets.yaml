# Secret 'mlops-secrets' replicado en cada namespace que lo consume.
# URLs con FQDN cross-namespace: <svc>.<namespace> (p.ej. postgres-svc.postgres).
# (En producción se usaría un gestor de secretos / ExternalSecrets; aquí es para el curso.)
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: postgres
type: Opaque
stringData:
  POSTGRES_USER: mlops
  POSTGRES_PASSWORD: mlops2026
  POSTGRES_DB: mlops
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin2026
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlflow
type: Opaque
stringData:
  MLFLOW_BACKEND_URI: "postgresql://mlops:mlops2026@postgres-svc.postgres:5432/mlflow_backend"
  MLFLOW_ARTIFACT_URI: "s3://mlflow-artifacts"
  MLFLOW_S3_ENDPOINT_URL: "http://minio-svc.minio:9000"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin2026
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mlops:mlops2026@postgres-svc.postgres:5432/mlops"
  MLFLOW_S3_ENDPOINT_URL: "http://minio-svc.minio:9000"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin2026
  RELOAD_TOKEN: "realty-reload-2026"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: streamlit
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mlops:mlops2026@postgres-svc.postgres:5432/mlops"
