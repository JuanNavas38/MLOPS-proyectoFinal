apiVersion: apps/v1
kind: Deployment
metadata:
  name: realty-ui
  namespace: streamlit
spec:
  replicas: 2   # demo GitOps: escalado declarativo aplicado por Argo CD desde Git
  selector:
    matchLabels:
      app: realty-ui
  template:
    metadata:
      labels:
        app: realty-ui
    spec:
      containers:
        - name: realty-ui
          image: juannavas38/realty-ui:latest   # TODO: confirmar usuario DockerHub y usar tag por SHA
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://realty-api-svc.api:8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mlops-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
