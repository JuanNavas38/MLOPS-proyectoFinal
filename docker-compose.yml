# Entorno LOCAL mínimo para desarrollar/probar el pipeline (Fase 1).
# No es el despliegue de producción (eso es K8s + Argo CD). Sirve para iterar rápido.
#
#   docker compose up -d            # levanta postgres + minio + mlflow
#   docker compose down             # detiene (conserva volúmenes)
#   docker compose down -v          # detiene y borra datos
#
# La API de datos del docente se corre aparte (contenedor 'data-api' en :8000).

services:
  postgres:
    image: postgres:15
    container_name: realty-postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops2026
      POSTGRES_DB: mlops
    ports:
      - "5442:5432"   # host 5442 (5432 ocupado por otro proyecto)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: realty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin2026
    ports:
      - "9010:9000"   # host 9010/9011 (9000/9001 ocupados por otro proyecto)
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: realty-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin2026 &&
      mc mb --ignore-existing local/mlflow &&
      echo 'bucket mlflow listo';
      "

  mlflow:
    build:
      context: ./docker/mlflow
    container_name: realty-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin2026
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops:mlops2026@postgres:5432/mlflow_backend
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0 --port 5000
    ports:
      - "5010:5000"   # host 5010 (5000 ocupado por otro proyecto)

volumes:
  pgdata:
  miniodata:
